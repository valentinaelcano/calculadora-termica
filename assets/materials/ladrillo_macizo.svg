<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="brick1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bf432f"/>
      <stop offset="50%" stop-color="#ad3927"/>
      <stop offset="100%" stop-color="#932b1b"/>
    </linearGradient>
    <linearGradient id="brick2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c94e39"/>
      <stop offset="50%" stop-color="#b83f2c"/>
      <stop offset="100%" stop-color="#993120"/>
    </linearGradient>
  </defs>
  <!-- Mortar base -->
  <rect width="120" height="120" fill="#d9d4cc"/>
  
  <!-- Row 1: y: 2 to 26 (h: 24) -->
  <rect x="2" y="2" width="56" height="25" rx="1.5" fill="url(#brick1)"/>
  <rect x="62" y="2" width="56" height="25" rx="1.5" fill="url(#brick2)"/>
  
  <!-- Row 2: y: 31 to 55 (h: 24) - Staggered -->
  <rect x="-28" y="31" width="56" height="25" rx="1.5" fill="url(#brick2)"/>
  <rect x="32" y="31" width="56" height="25" rx="1.5" fill="url(#brick1)"/>
  <rect x="92" y="31" width="56" height="25" rx="1.5" fill="url(#brick2)"/>
  
  <!-- Row 3: y: 60 to 84 (h: 24) -->
  <rect x="2" y="60" width="56" height="25" rx="1.5" fill="url(#brick2)"/>
  <rect x="62" y="60" width="56" height="25" rx="1.5" fill="url(#brick1)"/>
  
  <!-- Row 4: y: 89 to 113 (h: 24) - Staggered -->
  <rect x="-28" y="89" width="56" height="25" rx="1.5" fill="url(#brick1)"/>
  <rect x="32" y="89" width="56" height="25" rx="1.5" fill="url(#brick2)"/>
  <rect x="92" y="89" width="56" height="25" rx="1.5" fill="url(#brick1)"/>

  <!-- Subtle clay bake speckles -->
  <g fill="#5a180d" opacity="0.25">
    <circle cx="15" cy="12" r="1"/><circle cx="42" cy="18" r="1.2"/><circle cx="75" cy="8" r="0.9"/><circle cx="102" cy="20" r="1.1"/>
    <circle cx="10" cy="42" r="1.2"/><circle cx="48" cy="48" r="1"/><circle cx="72" cy="38" r="1.3"/><circle cx="112" cy="45" r="0.9"/>
    <circle cx="20" cy="72" r="1.1"/><circle cx="50" cy="68" r="0.8"/><circle cx="85" cy="76" r="1.2"/><circle cx="104" cy="65" r="1"/>
    <circle cx="12" cy="98" r="0.9"/><circle cx="45" cy="104" r="1.2"/><circle cx="78" cy="95" r="1"/><circle cx="110" cy="106" r="1.1"/>
  </g>
</svg>
