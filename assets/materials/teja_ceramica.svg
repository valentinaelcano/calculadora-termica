<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <!-- Barrel tile curved 3D gradient -->
    <linearGradient id="tileBarrel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="30%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="tileShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#431407" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" fill="#9a3412"/>

  <!-- Row 1 (y: 0 to 44) -->
  <g>
    <path d="M0,0 Q20,-6 40,0 L40,40 Q20,34 0,40 Z" fill="url(#tileBarrel)"/>
    <path d="M40,0 Q60,-6 80,0 L80,40 Q60,34 40,40 Z" fill="url(#tileBarrel)"/>
    <path d="M80,0 Q100,-6 120,0 L120,40 Q100,34 80,40 Z" fill="url(#tileBarrel)"/>
  </g>
  <!-- Overlap shadow from row 1 onto row 2 -->
  <rect x="0" y="36" width="120" height="10" fill="url(#tileShadow)"/>

  <!-- Row 2 (y: 38 to 82) - Staggered by 20px -->
  <g>
    <path d="M-20,38 Q0,32 20,38 L20,78 Q0,72 -20,78 Z" fill="url(#tileBarrel)"/>
    <path d="M20,38 Q40,32 60,38 L60,78 Q40,72 20,78 Z" fill="url(#tileBarrel)"/>
    <path d="M60,38 Q80,32 100,38 L100,78 Q80,72 60,78 Z" fill="url(#tileBarrel)"/>
    <path d="M100,38 Q120,32 140,38 L140,78 Q120,72 100,78 Z" fill="url(#tileBarrel)"/>
  </g>
  <!-- Overlap shadow from row 2 onto row 3 -->
  <rect x="0" y="74" width="120" height="10" fill="url(#tileShadow)"/>

  <!-- Row 3 (y: 76 to 120) -->
  <g>
    <path d="M0,76 Q20,70 40,76 L40,120 Q20,114 0,120 Z" fill="url(#tileBarrel)"/>
    <path d="M40,76 Q60,70 80,76 L80,120 Q60,114 40,120 Z" fill="url(#tileBarrel)"/>
    <path d="M80,76 Q100,70 120,76 L120,120 Q100,114 80,120 Z" fill="url(#tileBarrel)"/>
  </g>

  <!-- Baked terracotta grain and patina -->
  <g fill="#431407" opacity="0.3">
    <circle cx="18" cy="18" r="1.2"/><circle cx="58" cy="22" r="1.5"/><circle cx="98" cy="16" r="1.3"/>
    <circle cx="38" cy="58" r="1.4"/><circle cx="78" cy="54" r="1.2"/><circle cx="118" cy="60" r="1.5"/>
    <circle cx="15" cy="98" r="1.3"/><circle cx="62" cy="94" r="1.5"/><circle cx="102" cy="102" r="1.2"/>
  </g>
</svg>
