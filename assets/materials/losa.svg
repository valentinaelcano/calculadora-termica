<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="losaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#949aa3"/>
      <stop offset="100%" stop-color="#737982"/>
    </linearGradient>
    <radialGradient id="rebarIron" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" fill="url(#losaGrad)"/>

  <!-- Aggregate stones in concrete slab -->
  <polygon points="12,18 22,12 26,24 16,30" fill="#5b616a"/>
  <polygon points="48,15 58,10 65,22 52,28" fill="#b8bfc7"/>
  <polygon points="88,20 98,14 105,26 94,32" fill="#525861"/>
  <polygon points="25,48 35,42 40,55 30,60" fill="#b0b7bf"/>
  <polygon points="68,45 80,38 85,52 74,58" fill="#4d535b"/>
  <polygon points="102,48 112,42 116,54 106,60" fill="#5c626b"/>
  
  <!-- Structural bottom reinforcement bars (Armadura inferior de losa) -->
  <line x1="0" y1="85" x2="120" y2="85" stroke="#1e293b" stroke-width="3" stroke-dasharray="8 4"/>
  
  <circle cx="20" cy="85" r="6" fill="url(#rebarIron)" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="50" cy="85" r="6" fill="url(#rebarIron)" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="80" cy="85" r="6" fill="url(#rebarIron)" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="110" cy="85" r="6" fill="url(#rebarIron)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Concrete fine pores & texture -->
  <g fill="#373d45" opacity="0.55">
    <circle cx="35" cy="25" r="1.3"/><circle cx="75" cy="22" r="1.5"/>
    <circle cx="15" cy="58" r="1.4"/><circle cx="55" cy="52" r="1.2"/>
    <circle cx="95" cy="56" r="1.5"/><circle cx="35" cy="105" r="1.4"/>
    <circle cx="65" cy="108" r="1.3"/><circle cx="95" cy="104" r="1.5"/>
  </g>
  <g fill="#d1d7de" opacity="0.5">
    <circle cx="20" cy="38" r="1.5"/><circle cx="70" cy="32" r="1.3"/>
    <circle cx="42" cy="70" r="1.4"/><circle cx="88" cy="72" r="1.6"/>
    <circle cx="18" cy="112" r="1.3"/><circle cx="50" cy="115" r="1.5"/><circle cx="82" cy="112" r="1.3"/>
  </g>
</svg>
