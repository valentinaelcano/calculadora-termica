<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="pore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b6bec4"/>
      <stop offset="70%" stop-color="#8c959c"/>
      <stop offset="100%" stop-color="#717a82"/>
    </radialGradient>
  </defs>
  <!-- Homogeneous light mineral matrix -->
  <rect width="120" height="120" fill="#e5eaed"/>

  <!-- Distinctive aerated micropores (microceldas esféricas) -->
  <g fill="url(#pore)">
    <circle cx="15" cy="15" r="3.2"/><circle cx="38" cy="12" r="2.2"/><circle cx="62" cy="18" r="3.5"/><circle cx="85" cy="12" r="2.8"/><circle cx="108" cy="16" r="3.1"/>
    <circle cx="26" cy="34" r="2.5"/><circle cx="50" cy="36" r="3.8"/><circle cx="74" cy="32" r="2.2"/><circle cx="96" cy="38" r="3.4"/>
    <circle cx="12" cy="54" r="3.4"/><circle cx="36" cy="56" r="2.4"/><circle cx="60" cy="52" r="3.6"/><circle cx="84" cy="58" r="2.6"/><circle cx="106" cy="52" r="3.2"/>
    <circle cx="24" cy="74" r="2.6"/><circle cx="46" cy="78" r="3.7"/><circle cx="70" cy="72" r="2.3"/><circle cx="94" cy="76" r="3.5"/>
    <circle cx="14" cy="94" r="3.3"/><circle cx="36" cy="96" r="2.2"/><circle cx="58" cy="92" r="3.5"/><circle cx="82" cy="98" r="2.7"/><circle cx="105" cy="92" r="3.3"/>
    <circle cx="28" cy="112" r="2.5"/><circle cx="52" cy="114" r="3.6"/><circle cx="76" cy="110" r="2.3"/><circle cx="98" cy="115" r="3.1"/>
  </g>

  <!-- Smaller micro-pores -->
  <g fill="#9aa2a9" opacity="0.65">
    <circle cx="24" cy="22" r="1.4"/><circle cx="72" cy="24" r="1.2"/><circle cx="98" cy="22" r="1.5"/><circle cx="14" cy="42" r="1.3"/>
    <circle cx="62" cy="40" r="1.4"/><circle cx="85" cy="46" r="1.2"/><circle cx="22" cy="62" r="1.5"/><circle cx="72" cy="60" r="1.3"/>
    <circle cx="114" cy="68" r="1.4"/><circle cx="34" cy="84" r="1.2"/><circle cx="82" cy="85" r="1.5"/><circle cx="18" cy="104" r="1.3"/>
    <circle cx="68" cy="102" r="1.4"/><circle cx="112" cy="106" r="1.2"/><circle cx="40" cy="118" r="1.3"/>
  </g>
  <!-- Surface sheen -->
  <rect width="120" height="120" fill="#ffffff" opacity="0.1"/>
