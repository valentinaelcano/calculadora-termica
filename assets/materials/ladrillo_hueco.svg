  <rect x="84" y="92" width="14" height="18" rx="2" fill="url(#hollow)" stroke="#9c3415" stroke-width="1.5"/>
  <rect x="103" y="92" width="10" height="18" rx="2" fill="url(#hollow)" stroke="#9c3415" stroke-width="1.5"/>
