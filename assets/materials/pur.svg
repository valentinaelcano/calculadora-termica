<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="purGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Polyurethane dense foam background -->
  <rect width="120" height="120" fill="url(#purGrad)"/>

  <!-- Dense micro-cells (celdas microscópicas cerradas) -->
  <g fill="#ca8a04" opacity="0.35">
    <circle cx="12" cy="14" r="2"/><circle cx="34" cy="10" r="1.8"/><circle cx="58" cy="16" r="2.2"/><circle cx="82" cy="12" r="1.9"/><circle cx="106" cy="15" r="2.1"/>
    <circle cx="22" cy="32" r="2.1"/><circle cx="46" cy="35" r="1.9"/><circle cx="70" cy="30" r="2.3"/><circle cx="94" cy="34" r="2"/>
    <circle cx="10" cy="52" r="1.9"/><circle cx="35" cy="55" r="2.2"/><circle cx="58" cy="50" r="2"/><circle cx="82" cy="54" r="2.2"/><circle cx="108" cy="50" r="1.8"/>
    <circle cx="24" cy="72" r="2.2"/><circle cx="48" cy="70" r="2"/><circle cx="72" cy="74" r="2.3"/><circle cx="96" cy="70" r="1.9"/>
    <circle cx="14" cy="92" r="2"/><circle cx="38" cy="95" r="2.2"/><circle cx="62" cy="90" r="1.9"/><circle cx="86" cy="94" r="2.3"/><circle cx="108" cy="90" r="2"/>
    <circle cx="26" cy="110" r="2.1"/><circle cx="50" cy="112" r="2"/><circle cx="74" cy="108" r="2.2"/><circle cx="98" cy="112" r="2"/>
  </g>

  <!-- Cell highlights -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="10" cy="12" r="1"/><circle cx="56" cy="14" r="1"/><circle cx="104" cy="13" r="1"/>
    <circle cx="44" cy="33" r="1"/><circle cx="92" cy="32" r="1"/><circle cx="33" cy="53" r="1"/>
    <circle cx="80" cy="52" r="1"/><circle cx="22" cy="70" r="1"/><circle cx="70" cy="72" r="1"/>
    <circle cx="36" cy="93" r="1"/><circle cx="84" cy="92" r="1"/><circle cx="48" cy="110" r="1"/>
  </g>

  <!-- Fine polyurethane expansion swirl lines -->
  <g stroke="#a16207" stroke-width="0.7" fill="none" opacity="0.3">
    <path d="M-10,25 Q35,40 70,20 T130,35"/>
    <path d="M-10,65 Q45,80 85,58 T130,70"/>
    <path d="M-10,100 Q30,115 75,95 T130,105"/>
  </g>
